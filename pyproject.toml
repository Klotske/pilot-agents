[dependency-groups]
dev = [
    "pyright>=1.1.414,<2",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "apps/*",
]

[tool.pyright]
include = [
    "packages/review-agent-core/src",
    "apps/review-agent-cli/src",
]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.12"
