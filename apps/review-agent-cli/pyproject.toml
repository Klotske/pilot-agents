[project]
name = "review-agent-cli"
version = "0.1.0"
description = "CLI for the git review agent"
readme = "README.md"
authors = [
    { name = "Klotske", email = "ilya@mokhov.vg" }
]
requires-python = ">=3.12"
dependencies = [
    "review-agent-core",
    "python-dotenv>=1,<2",
]

[project.scripts]
review-agent = "review_agent_cli.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
review-agent-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8,<9",
]
