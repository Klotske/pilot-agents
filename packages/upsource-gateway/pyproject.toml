[project]
name = "upsource-gateway"
version = "0.1.0"
description = "Lightweight client for the Upsource RPC API"
readme = "README.md"
authors = [
    { name = "Klotske", email = "ilya@mokhov.vg" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]
